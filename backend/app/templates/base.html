<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.SHOP_NAME }}{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:860px;margin:0 auto;padding:1rem;line-height:1.5}
    fieldset{margin:1rem 0;padding:1rem;border:1px solid #bbb;border-radius:8px}
    label{display:block;margin-top:.5rem;font-weight:600}
    input,select,textarea{width:100%;padding:.5rem;box-sizing:border-box}
    button,.btn{padding:.6rem 1rem;cursor:pointer;border:0;border-radius:6px;background:#111;color:#fff;text-decoration:none;display:inline-block}
    table{width:100%;border-collapse:collapse}td,th{padding:.4rem;border-bottom:1px solid #ddd;text-align:left}
    .flash{padding:.6rem;border-radius:6px;margin:.5rem 0}.error{background:#fde2e2}.ok{background:#e0f5e0}
  </style>
</head>
<body>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
