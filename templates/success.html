{% extends "base.html" %}
{% block title %}Order received | SwiftPrint{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-16 text-center">
  <div class="mx-auto w-14 h-14 rounded-full bg-sun flex items-center justify-center" aria-hidden="true">
    <svg viewBox="0 0 24 24" class="w-7 h-7" fill="none" stroke="#16213a" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg>
  </div>
  <h1 class="font-display font-extrabold text-3xl mt-6">Order received</h1>
  <p class="mt-3 text-ink/70">Your order number is</p>
  <p class="font-display font-extrabold text-3xl mt-1 select-all">{{ ref }}</p>
  <p class="mt-5 text-ink/70">We will message you on WhatsApp to confirm the price and pickup time.</p>
  <a href="https://wa.me/{{ shop }}?text={{ ('Hello, my order number is ' ~ ref)|urlencode }}" class="mt-7 inline-block bg-ink text-white font-bold rounded-full px-6 py-3">Message us about this order</a>
  <div class="mt-4"><a href="{{ url_for('index') }}" class="text-sm underline">Place another order</a></div>
</section>
{% endblock %}
