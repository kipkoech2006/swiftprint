{% extends "base.html" %}
{% block title %}{{ title }} | {{ config.SHOP_NAME }}{% endblock %}
{% block content %}
<section class="container narrow page center">
  <p class="total" style="font-size:3.5rem;margin:1rem 0 0">{{ code }}</p>
  <h1 style="font-size:2rem">{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="actions" style="justify-content:center">
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Go to the home page</a>
    <a class="btn btn-outline" href="{{ url_for('main.checkout') }}">Start an order</a>
  </div>
</section>
{% endblock %}
